<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Math Lab - Khám phá Hàm số y = cot(x)</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 30%, #1e1e2f 0%, #0b0c10 100%);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-pink: #ff0844;
      --accent-gold: #ffb199;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f0f4f8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      display: flex; justify-content: center; align-items: center;
    }

    #app-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px;
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--glass-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: 20px;
      padding: 12px 24px; z-index: 10;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .ai-badge {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #000; font-family: 'Orbitron', sans-serif; font-weight: 800;
      padding: 6px 12px; border-radius: 8px; font-size: 12px;
      letter-spacing: 1px; box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
    }
    h1 { font-size: 18px; font-weight: 800; }

    .table-hud {
      display: flex; gap: 6px; background: rgba(0,0,0,0.3); padding: 6px;
      border-radius: 12px; border: 1px solid var(--glass-border);
    }
    .hud-col {
      display: flex; flex-direction: column; align-items: center;
      padding: 4px 10px; border-radius: 8px; transition: all 0.3s ease;
      font-size: 12px; font-family: 'Orbitron', sans-serif;
    }
    .hud-col.active {
      background: rgba(0,242,254,0.25);
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0,242,254,0.5); transform: translateY(-2px);
    }

    main {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    }

    #stage { width: 100%; height: 100%; display: block; }

    footer {
      display: flex; justify-content: center; gap: 16px;
      z-index: 10; padding-bottom: 12px;
    }
    .btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #050b14; font-family: 'Orbitron', sans-serif; font-weight: 700;
      padding: 14px 32px; border: none; border-radius: 30px; cursor: pointer;
      font-size: 14px; letter-spacing: 1px; transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0, 242, 254, 0.3);
    }
    .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 15px 35px rgba(0, 242, 254, 0.5); }

    /* Victory Modal */
    #victory-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      background: rgba(15, 18, 28, 0.9); backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 242, 254, 0.4); border-radius: 28px;
      padding: 30px 50px; text-align: center; z-index: 100;
      opacity: 0; pointer-events: none; transition: all 0.5s ease;
      box-shadow: 0 30px 80px rgba(0, 242, 254, 0.3);
    }
    #victory-modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    #victory-modal h2 { font-family: 'Orbitron', sans-serif; font-size: 22px; color: #fff; margin-bottom: 10px; }
    #victory-modal p { font-size: 15px; color: #a0aec0; margin-bottom: 20px; }
  </style>
</head>
<body>

<div id="app-container">
  <header>
    <div class="brand">
      <span class="ai-badge">AI LAB</span>
      <h1>Đồ thị Hàm số y = cot(x)</h1>
    </div>
    <div class="table-hud" id="hud-table"></div>
  </header>

  <main>
    <canvas id="stage"></canvas>
  </main>

  <div id="victory-modal">
    <h2>🎉 CHÚC MỪNG BẠN ĐÃ MỞ KHÓA BÍ MẬT! 🎉</h2>
    <p>Bạn đã hoàn thành phác họa hàm số <strong>y = cot(x)</strong> tuần hoàn với chu kỳ <strong>T = π</strong></p>
    <button class="btn" onclick="restartAnimation()">XEM LẠI LẦN NỮA</button>
  </div>

  <footer>
    <button class="btn" id="start-btn" onclick="startAnimation()">▶ BẮT ĐẦU TRÌNH DIỄN</button>
  </footer>
</div>

<script>
  const tableData = [
    { xLabel: 'π/6', yLabel: '√3', xVal: Math.PI/6, yVal: Math.sqrt(3) },
    { xLabel: 'π/4', yLabel: '1', xVal: Math.PI/4, yVal: 1 },
    { xLabel: 'π/3', yLabel: '√3/3', xVal: Math.PI/3, yVal: 1/Math.sqrt(3) },
    { xLabel: 'π/2', yLabel: '0', xVal: Math.PI/2, yVal: 0 },
    { xLabel: '2π/3', yLabel: '-√3/3', xVal: 2*Math.PI/3, yVal: -1/Math.sqrt(3) },
    { xLabel: '3π/4', yLabel: '-1', xVal: 3*Math.PI/4, yVal: -1 },
    { xLabel: '5π/6', yLabel: '-√3', xVal: 5*Math.PI/6, yVal: -Math.sqrt(3) }
  ];

  // Render HUD Table
  const hudTable = document.getElementById('hud-table');
  tableData.forEach((item, index) => {
    const col = document.createElement('div');
    col.className = 'hud-col';
    col.id = `hud-${index}`;
    col.innerHTML = `
      <span style="color:#a0aec0; font-size:10px;">x</span>
      <strong style="color:#00f2fe">${item.xLabel}</strong>
      <span style="color:#a0aec0; font-size:10px; margin-top:2px;">cot</span>
      <strong style="color:#ffb199">${item.yLabel}</strong>
    `;
    hudTable.appendChild(col);
  });

  // Web Audio Synthesizer
  let audioCtx = null;
  function playTone(freq, type = 'sine', duration = 0.2) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function playFanfare() {
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      setTimeout(() => playTone(freq, 'triangle', 0.6), idx * 120);
    });
  }

  // Canvas Setup
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let width, height, originX, originY, scaleX, scaleY;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    originX = width / 2;
    originY = height / 2;
    scaleX = width / (3 * Math.PI);
    scaleY = height / 8;
  }
  window.addEventListener('resize', resize);
  resize();

  let isAnimating = false;
  let progress = 0; // 0 -> 1
  let currentPointIdx = -1;
  let animReq = null;

  function drawGrid() {
    ctx.clearRect(0, 0, width, height);

    // Lưới dọc / ngang
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let x = -2 * Math.PI; x <= 2 * Math.PI; x += Math.PI / 6) {
      let px = originX + x * scaleX;
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, height); ctx.stroke();
    }

    // Trục Oxy
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(width, originY); ctx.stroke(); // Ox
    ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, height); ctx.stroke(); // Oy

    // Nhãn trục
    ctx.fillStyle = '#a0aec0';
    ctx.font = '12px Orbitron';
    ctx.fillText('O', originX - 15, originY + 20);
    ctx.fillText('x', width - 20, originY - 10);
    ctx.fillText('y', originX + 10, 20);

    // Đường tiệm cận
    ctx.strokeStyle = 'rgba(255, 8, 68, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    [-Math.PI, 0, Math.PI, 2 * Math.PI].forEach(a => {
      let px = originX + a * scaleX;
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, height); ctx.stroke();
    });
    ctx.setLineDash([]);
  }

  function loop() {
    drawGrid();

    if (isAnimating || progress > 0) {
      // 1. Vẽ các điểm đã chấm
      tableData.forEach((pt, i) => {
        if (i <= currentPointIdx) {
          let px = originX + pt.xVal * scaleX;
          let py = originY - pt.yVal * scaleY;

          // Đường dóng laser
          ctx.strokeStyle = 'rgba(0, 242, 254, 0.2)';
          ctx.beginPath(); ctx.moveTo(px, originY); ctx.lineTo(px, py); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(originX, py); ctx.lineTo(px, py); ctx.stroke();

          // Điểm phát sáng
          ctx.fillStyle = '#00f2fe';
          ctx.shadowColor = '#00f2fe';
          ctx.shadowBlur = 12;
          ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
        }
      });

      // 2. Vẽ đường cong y = cot(x)
      if (progress > 0.3) {
        let curveProgress = (progress - 0.3) / 0.7; // Nối đường cong
        ctx.strokeStyle = '#00f2fe';
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#00f2fe';
        ctx.shadowBlur = 15;

        let startX = 0.1;
        let endX = Math.PI - 0.1;
        let maxCurrentX = startX + (endX - startX) * Math.min(1, curveProgress);

        ctx.beginPath();
        for (let x = startX; x <= maxCurrentX; x += 0.02) {
          let px = originX + x * scaleX;
          let py = originY - (1 / Math.tan(x)) * scaleY;
          if (x === startX) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Mở rộng các nhánh tuần hoàn
        if (curveProgress >= 1.0) {
          [-Math.PI, Math.PI].forEach(shift => {
            ctx.strokeStyle = 'rgba(79, 172, 254, 0.4)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let x = 0.1; x <= Math.PI - 0.1; x += 0.02) {
              let px = originX + (x + shift) * scaleX;
              let py = originY - (1 / Math.tan(x)) * scaleY;
              if (x === 0.1) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.stroke();
          });
        }
      }
    }

    animReq = requestAnimationFrame(loop);
  }

  function startAnimation() {
    if (isAnimating) return;
    isAnimating = true;
    progress = 0;
    currentPointIdx = -1;
    document.getElementById('start-btn').style.display = 'none';

    let startTime = performance.now();
    let duration = 5000; // 5 giây chạy hoạt ảnh

    function step(now) {
      let elapsed = now - startTime;
      progress = Math.min(1, elapsed / duration);

      // Tính điểm hiện tại để sáng HUD
      if (progress <= 0.3) {
        let idx = Math.floor((progress / 0.3) * tableData.length);
        if (idx !== currentPointIdx && idx < tableData.length) {
          currentPointIdx = idx;
          playTone(400 + currentPointIdx * 80, 'sine', 0.15);
          document.querySelectorAll('.hud-col').forEach(c => c.classList.remove('active'));
          if (document.getElementById(`hud-${currentPointIdx}`)) {
            document.getElementById(`hud-${currentPointIdx}`).classList.add('active');
          }
        }
      } else if (currentPointIdx < tableData.length - 1) {
        currentPointIdx = tableData.length - 1;
        document.querySelectorAll('.hud-col').forEach(c => c.classList.add('active'));
      }

      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        isAnimating = false;
        playFanfare();
        document.getElementById('victory-modal').classList.add('show');
      }
    }

    requestAnimationFrame(step);
  }

  function restartAnimation() {
    document.getElementById('victory-modal').classList.remove('show');
    document.getElementById('start-btn').style.display = 'block';
    progress = 0;
    currentPointIdx = -1;
    isAnimating = false;
    document.querySelectorAll('.hud-col').forEach(c => c.classList.remove('active'));
  }

  loop();
</script>

</body>
</html>
